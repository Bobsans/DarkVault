# Toolchain versions and the container base image are pinned exactly: update them in
# separate, reviewed changes so one commit always builds on one toolchain.
name: CI and release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, runtime: linux-x64, arch: x64, python-arch: x64 }
          - { os: ubuntu-22.04-arm, runtime: linux-arm64, arch: arm64, python-arch: arm64 }
          - { os: windows-2025, runtime: win-x64, arch: x64, python-arch: x64 }
          - { os: windows-11-arm, runtime: win-arm64, arch: arm64, python-arch: x64 }
          - { os: macos-15-intel, runtime: osx-x64, arch: x64, python-arch: x64 }
          - { os: macos-15, runtime: osx-arm64, arch: arm64, python-arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.401'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          architecture: ${{ matrix.arch }}
          cache-dependency-path: |
            cli/go.sum
            clients/go/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
          architecture: ${{ matrix.python-arch }}
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml
      - name: Install frontend package manager
        run: npm install --global --ignore-scripts pnpm@11.27.1
      - name: Install Linux Native AOT toolchain
        if: runner.os == 'Linux'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          sudo apt-get update
          sudo apt-get install --yes clang zlib1g-dev
      - name: Verify Native AOT server, HTTP SDKs, CLI, browser and package artifacts
        run: ./tools/verify.ps1 -NativeAot -Runtime '${{ matrix.runtime }}' -ReleaseTag $env:RELEASE_TAG
      - name: Test native release archive validation
        run: python -m unittest discover -s tools -p 'test_check_release.py'
      - name: Package tested native server
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./tools/package-native-server.ps1 -Tag $env:RELEASE_TAG -Runtime '${{ matrix.runtime }}'
      - name: Preserve native server archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-server-${{ matrix.runtime }}
          if-no-files-found: error
          path: artifacts/native-assets/*
      - name: Test npm publication checks
        run: node --test tools/publish-npm.test.mjs
      - name: Audit dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = "Stop"
          $nugetProjects = @(
            'server/DarkVault.Server/DarkVault.Server.csproj',
            'clients/csharp/DarkVault.Client/DarkVault.Client.csproj',
            'clients/csharp/DarkVault.Extensions.Configuration/DarkVault.Extensions.Configuration.csproj',
            'server/DarkVault.Server.Tests/DarkVault.Server.Tests.csproj',
            'clients/csharp/DarkVault.Client.Tests/DarkVault.Client.Tests.csproj'
          )
          foreach ($project in $nugetProjects) {
            $audit = dotnet list $project package --vulnerable --include-transitive --format json | ConvertFrom-Json
            $vulnerable = @($audit.projects.frameworks.topLevelPackages) + @($audit.projects.frameworks.transitivePackages)
            if (@($vulnerable | Where-Object { $_.vulnerabilities }).Count -ne 0) { throw "Vulnerable NuGet dependencies found in $project" }
          }
          Push-Location cli
          try { go run golang.org/x/vuln/cmd/govulncheck@617f44b718537dccdea1915395650e0529e3b72e ./... } finally { Pop-Location }
          Push-Location clients/go
          try { go run golang.org/x/vuln/cmd/govulncheck@617f44b718537dccdea1915395650e0529e3b72e ./... } finally { Pop-Location }

      - name: Audit JavaScript and Python dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          pnpm --dir clients/typescript audit --audit-level high
          pnpm --dir admin audit --audit-level high
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --strict --path artifacts/python-env

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require release tag commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            cli/go.sum
            clients/go/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
      - name: Install Python build tool
        run: python -m pip install build==1.6.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Install SDK package manager
        run: npm install --global --ignore-scripts pnpm@11.27.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-server-*
          merge-multiple: true
          path: artifacts/native-assets
      - name: Assemble native servers, SDKs and CLI
        run: ./tools/package-release.ps1 -Tag $env:RELEASE_TAG -ServerAssets artifacts/native-assets
      - name: Verify release versions and checksums
        run: python tools/check-release.py "artifacts/releases/$env:RELEASE_TAG/assets" $env:RELEASE_TAG (git rev-parse HEAD)
      - name: Attest release assets
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: artifacts/releases/${{ github.ref_name }}/assets/*
      - name: Preserve verified registry packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-packages
          if-no-files-found: error
          path: |
            artifacts/releases/${{ github.ref_name }}/assets/*.nupkg
            artifacts/releases/${{ github.ref_name }}/assets/*.whl
            artifacts/releases/${{ github.ref_name }}/assets/darkvault_client-*.tar.gz
            artifacts/releases/${{ github.ref_name }}/assets/*.tgz
      - name: Publish GitHub Release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $assets = @(Get-ChildItem "artifacts/releases/$env:RELEASE_TAG/assets" -File | ForEach-Object FullName)
          if ($assets.Count -ne 20) { throw 'Expected 18 packages, release.json and SHA256SUMS.' }
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "DarkVault $env:RELEASE_TAG" --generate-notes
          $commit = git rev-parse HEAD
          gh api 'repos/{owner}/{repo}/git/refs' -f "ref=refs/tags/clients/go/$env:RELEASE_TAG" -f "sha=$commit" --silent
          gh release edit $env:RELEASE_TAG --draft=false

  publish-pypi:
    needs: release
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registry-packages
          path: packages
      - name: Select Python distributions
        run: |
          mkdir dist
          cp packages/*.whl packages/darkvault_client-*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true

  publish-nuget:
    needs: release
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registry-packages
          path: packages
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.401'
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish both NuGet packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          packages=(packages/*.nupkg)
          if [ "${#packages[@]}" -ne 2 ]; then
            echo "Expected exactly two NuGet packages, found ${#packages[@]}" >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  publish-npm:
    needs: release
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registry-packages
          path: packages
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Install npm with OIDC support
        run: npm install --global --ignore-scripts npm@11.19.1
      - name: Publish verified npm archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node tools/publish-npm.mjs "packages/darkvault-client-${RELEASE_TAG#v}.tgz" "${RELEASE_TAG#v}"
  publish-container:
    needs: release
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/darkvault
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-server-linux-*
          merge-multiple: true
          path: artifacts/native-assets
      - name: Prepare container context from verified Linux servers
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $context = Join-Path $root 'artifacts/container'
          $amd64 = Join-Path $context 'amd64'
          $arm64 = Join-Path $context 'arm64'
          New-Item -ItemType Directory -Force -Path $amd64, $arm64 | Out-Null
          $archives = @{
            amd64 = Join-Path $root "artifacts/native-assets/darkvault-server-$env:RELEASE_TAG-linux-x64.tar.gz"
            arm64 = Join-Path $root "artifacts/native-assets/darkvault-server-$env:RELEASE_TAG-linux-arm64.tar.gz"
          }
          foreach ($arch in $archives.Keys) {
            $archive = $archives[$arch]
            if (!(Test-Path -LiteralPath $archive)) { throw "Missing verified Linux server archive: $archive" }
            tar -xzf $archive -C (Join-Path $context $arch)
          }
          Copy-Item -LiteralPath (Join-Path $root 'deploy/Dockerfile') -Destination (Join-Path $context 'Dockerfile')
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - name: Build and push multi-platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: artifacts/container
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Verify published image version
        env:
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $image = "$env:IMAGE_NAME`:$env:IMAGE_VERSION"
          $expected = "$($env:RELEASE_TAG.Substring(1))+$env:GITHUB_SHA"
          $actual = (docker run --rm $image --version).Trim()
          if ($actual -cne $expected) { throw "Published image version mismatch: expected $expected, got $actual" }
