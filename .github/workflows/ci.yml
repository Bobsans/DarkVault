name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            cli/go.sum
            clients/go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml
      - name: Install frontend package manager
        run: npm install --global pnpm@11
      - name: Verify HTTP SDKs, CLI, browser and package artifacts
        run: ./tools/verify.ps1
      - name: Verify committed browser bundle
        run: git diff --exit-code -- server/DarkVault.Server/wwwroot/app.js
      - name: Audit dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = "Stop"
          $audit = dotnet list server/DarkVault.Server/DarkVault.Server.csproj package --vulnerable --include-transitive --format json | ConvertFrom-Json
          $vulnerable = @($audit.projects.frameworks.topLevelPackages) + @($audit.projects.frameworks.transitivePackages)
          if (@($vulnerable | Where-Object { $_.vulnerabilities }).Count -ne 0) { throw "Vulnerable NuGet dependencies found" }
          Push-Location cli
          try { go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./... } finally { Pop-Location }
          Push-Location clients/go
          try { go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./... } finally { Pop-Location }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            cli/go.sum
            clients/go/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python build tool
        run: python -m pip install build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SDK package manager
        run: npm install --global pnpm@11
      - name: Package server, SDKs and CLI
        run: ./tools/package-release.ps1 -Tag $env:RELEASE_TAG
      - name: Verify release versions and checksums
        run: python tools/check-release.py "artifacts/releases/$env:RELEASE_TAG/assets" $env:RELEASE_TAG (git rev-parse HEAD)
      - name: Publish GitHub Release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $assets = @(Get-ChildItem "artifacts/releases/$env:RELEASE_TAG/assets" -File | ForEach-Object FullName)
          if ($assets.Count -ne 20) { throw 'Expected 18 packages, release.json and SHA256SUMS.' }
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "DarkVault $env:RELEASE_TAG" --generate-notes
          $commit = git rev-parse HEAD
          gh api 'repos/{owner}/{repo}/git/refs' -f "ref=refs/tags/clients/go/$env:RELEASE_TAG" -f "sha=$commit" --silent
          gh release edit $env:RELEASE_TAG --draft=false
