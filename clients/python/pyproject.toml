[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "darkvault-client"
version = "1.0.0"
description = "Token-authenticated DarkVault client with HTTPS and JWE encryption"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["jwcrypto>=1.6.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
darkvault = ["py.typed"]
